<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance | L&amp;V Civil Contracting</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0f14">
  <link rel="icon" href="/favicon.ico" sizes="16x16">
  <style>
    :root {
      --ink-950: #070b10;
      --ink-800: #111a24;
      --steel-300: #b3c3d1;
      --accent-500: #45b1f0;
      --accent-glow: rgba(69, 177, 240, 0.32);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(ellipse at top, var(--ink-800), var(--ink-950) 70%);
      color: #fff;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      text-align: center;
    }
    main {
      max-width: 560px;
      padding: 48px 32px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 4px 8px rgba(2, 6, 10, 0.5), 0 32px 72px rgba(2, 6, 10, 0.55);
    }
    img { width: 140px; height: auto; margin-bottom: 28px; border-radius: 9px; }
    h1 {
      margin: 0 0 16px;
      font-family: "Archivo", "Segoe UI", system-ui, sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    p { margin: 0 0 14px; color: var(--steel-300); }
    a { color: var(--accent-500); font-weight: 600; text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; }
    .contact {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo.png" alt="L&amp;V Civil Contracting">
    <h1>Under Maintenance</h1>
    <p>This website is temporarily unavailable while maintenance is carried out.</p>
    <p>Please check back soon.</p>
    <p class="contact">Site owner? To restore access, contact
      <a href="mailto:admin@kwinnovations.com.au">admin@kwinnovations.com.au</a>.</p>
  </main>
</body>
</html>
